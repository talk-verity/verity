services:
  postgres:
    image: postgres:17
    container_name: delphi_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: talkdelphi
      POSTGRES_DB: delphi

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
