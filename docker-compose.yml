services:
  postgres:
    image: postgres:17
    container_name: verity_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: talkverity
      POSTGRES_DB: verity

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
